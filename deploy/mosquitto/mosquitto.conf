# Generated with Claude (Anthropic, 2026).
# Docs: https://mosquitto.org/man/mosquitto-conf-5.html
persistence false
allow_anonymous false
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/aclfile

# Inside Docker only (the port is not published): the API and the simulator talk to the
# broker over the private Docker network, which never leaves the VM.
listener 1883

# From the internet: MQTT over TLS for the Pi. The certificate is Caddy's Let's Encrypt
# one for the domain, copied in by start.sh. Same logins and ACL as above.
# TLS docs: https://mosquitto.org/man/mosquitto-tls-7.html
listener 8883
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
