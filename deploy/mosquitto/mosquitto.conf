# Generated with Claude (Anthropic, 2026).
# Docs: https://mosquitto.org/man/mosquitto-conf-5.html
persistence false
# Stay root so Mosquitto can read Caddy's certificate key (owned by root).
# Fine for a prototype; a real deployment would copy the cert with the right owner.
user root
allow_anonymous false
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/aclfile

# Inside Docker only: the FastAPI container connects here.
listener 1883

# From the internet (the Pi): TLS only. Replace example.com with your DOMAIN.
listener 8883
certfile /caddy/caddy/certificates/acme-v02.api.letsencrypt.org-directory/example.com/example.com.crt
keyfile /caddy/caddy/certificates/acme-v02.api.letsencrypt.org-directory/example.com/example.com.key
# Mosquitto only reads the certificate at startup: `docker compose restart mqtt`
# after Caddy renews it (about every 60 days).
