
name: SmartBed CI

# Automatically check every push and pull request.
# Also allow the workflow to be started manually.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # -------------------------------------------
  # Job 1: FastAPI backend tests
  # -------------------------------------------
  backend:
    name: Backend API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend-fastapi/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install -r backend-fastapi/requirements.txt

      - name: Run FastAPI tests
        working-directory: backend-fastapi
        run: python -m pytest -q

  # -------------------------------------------
  # Job 2: React frontend tests and build
  # -------------------------------------------
  frontend:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Verify production build
        working-directory: frontend
        run: npm run build

  # -------------------------------------------
  # Job 3: Raspberry Pi sensor logic tests
  # -------------------------------------------
  hardware:
    name: Hardware Safety Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check hardware Python syntax
        run: python -m compileall -q hardware

      - name: Test occupancy filtering
        run: python hardware/checks/occupancy_check.py

      - name: Test DHT22 freshness protection
        run: python hardware/checks/dht_freshness_check.py

      - name: Test FSR402 recovery
        run: python hardware/checks/fsr_quality_check.py

      - name: Test MQTT command safety
        run: python hardware/checks/commands_check.py
